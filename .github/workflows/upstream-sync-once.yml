name: One-time upstream sync integration

on:
  push:
    branches:
      - sync/upstream-2026-10-28
    paths:
      - .github/workflows/upstream-sync-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sync/upstream-2026-10-28
      - name: Integrate exact upstream revision, preserving fork on textual conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/cookjohn/zotero-mcp.git
          git fetch --no-tags upstream main
          UPSTREAM_SHA=81d0777b49ded0959d197c7610d8b6e5f32c2485
          test "$(git rev-parse upstream/main)" = "$UPSTREAM_SHA"
          git merge --no-ff --no-edit -X ours "$UPSTREAM_SHA"
          echo "Integrated upstream revision: $UPSTREAM_SHA"
          git show --stat --oneline --summary HEAD
      - name: Push integration candidate to isolated branch (review required)
        shell: bash
        run: |
          git push origin HEAD:refs/heads/sync/upstream-2026-10-28
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zotero-mcp-plugin/package-lock.json
      - name: Install and build
        working-directory: zotero-mcp-plugin
        run: |
          npm ci
          npm run build
          npm install --no-save --package-lock=false tsx
          # Node-only unit tests; Zotero-dependent tests require the Zotero runtime.
          printf 'import { expect } from "chai"; globalThis.expect = expect;\n' > test/.ci-node-globals.mjs
          NODE_OPTIONS='--import tsx' npx mocha --no-config --require ./test/.ci-node-globals.mjs test/httpRequestReader.test.ts test/citationFileSafety.test.ts test/externalToolRegistry.test.ts
