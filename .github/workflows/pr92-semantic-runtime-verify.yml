name: PR92 semantic runtime parity verify

on:
  push:
    branches:
      - review/pr92-semantic-runtime-verify

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: zotero-mcp-plugin/package-lock.json
      - name: Build cloneorcopy baseline and audited integration
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/pr92-base c616d620427cbbd075d48caf6560ddd9c9f72728
          (cd /tmp/pr92-base/zotero-mcp-plugin && npm ci && npm run build)
          (cd zotero-mcp-plugin && npm ci && npm run build)
      - name: Download cloneorcopy 1.5.2 release XPI
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/cloneorcopy/zotero-mcp-plus/releases/download/1.5.2/zotero-mcp-plugin.xpi \
            -o /tmp/cloneorcopy-1.5.2.xpi
          mkdir -p /tmp/cloneorcopy-release
          unzip -q /tmp/cloneorcopy-1.5.2.xpi -d /tmp/cloneorcopy-release
      - name: Compare release, rebuilt main, and integration UI/runtime
        shell: python
        run: |
          from pathlib import Path
          import re, hashlib, difflib

          base_content = Path('/tmp/pr92-base/zotero-mcp-plugin/.scaffold/build/addon/content')
          new_content = Path('zotero-mcp-plugin/.scaffold/build/addon/content')
          rel_content = Path('/tmp/cloneorcopy-release/content')

          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()

          for relpath in ['searchDialog.xhtml', 'searchDialog.css']:
              rp = rel_content / relpath
              bp = base_content / relpath
              np = new_content / relpath
              print(relpath, 'release==main exact', rp.read_bytes() == bp.read_bytes())
              print(relpath, 'release_sha', sha(rp), 'main_sha', sha(bp), 'integration_sha', sha(np))

          rel_js = (rel_content / 'scripts/zotero-mcp-plugin.js').read_text()
          base_js = (base_content / 'scripts/zotero-mcp-plugin.js').read_text()
          new_js = (new_content / 'scripts/zotero-mcp-plugin.js').read_text()
          print('JS sizes release/main/integration:', len(rel_js), len(base_js), len(new_js))
          print('JS sha release:', hashlib.sha256(rel_js.encode()).hexdigest())
          print('JS sha main:', hashlib.sha256(base_js.encode()).hexdigest())
          print('JS sha integration:', hashlib.sha256(new_js.encode()).hexdigest())

          def normalize_build_metadata(s: str) -> str:
              s = re.sub(r'buildTime:\s*"[^"]*"', 'buildTime:"<BUILD_TIME>"', s)
              s = re.sub(r'buildTime:\s*\x27[^\x27]*\x27', "buildTime:'<BUILD_TIME>'", s)
              return s

          rn = normalize_build_metadata(rel_js)
          bn = normalize_build_metadata(base_js)
          print('release JS == rebuilt main after buildTime normalization:', rn == bn)
          if rn != bn:
              diff = list(difflib.unified_diff(rn.splitlines(True), bn.splitlines(True), fromfile='release-js', tofile='rebuilt-main-js'))
              print('release vs rebuilt main JS diff lines:', len(diff))
              print(''.join(diff[:1200]))

          # Compare exact runtime code around semantic-search markers in release vs rebuilt main.
          markers = [
              '[SemanticDialog] Performing search',
              '[SemanticDialog] Found',
              '[SemanticDialog] Finding similar',
              'findSimilar(itemKey',
              'topK: 50',
              'minScore: 0.1',
              'matchedChunks',
              'setupSnippetTooltip',
          ]
          for marker in markers:
              ri = rel_js.find(marker)
              bi = base_js.find(marker)
              print(f'MARKER {marker!r}: release_pos={ri}, main_pos={bi}')
              if ri >= 0 and bi >= 0:
                  rctx = rel_js[max(0, ri-1800):ri+3500]
                  bctx = base_js[max(0, bi-1800):bi+3500]
                  same = normalize_build_metadata(rctx) == normalize_build_metadata(bctx)
                  print('  context identical:', same)
                  if not same:
                      d = list(difflib.unified_diff(rctx.splitlines(True), bctx.splitlines(True), fromfile='release-context', tofile='main-context'))
                      print(''.join(d[:400]))

          # Current integration controller changes must not touch search parameters.
          controller = Path('zotero-mcp-plugin/src/modules/semanticSearchDialog.ts').read_text()
          assert 'topK: 50' in controller
          assert 'minScore: 0.1' in controller
          assert 'findSimilar(itemKey, { topK: 15 })' in controller
