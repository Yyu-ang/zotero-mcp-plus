name: tmp rebase external tool api

on:
  push:
    branches:
      - tmp-rebase-external-tool-api

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr92-external-tool-api-rebased
          fetch-depth: 0

      - name: Reapply external tool API commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin pr92-external-tool-api

          set +e
          git cherry-pick 9015cd9faa4a55f1a732a78010b298e602e0f811
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Conflicts to resolve with three-way union:"
            echo "$conflicts"
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              git show ":1:$f" > /tmp/base
              git show ":2:$f" > /tmp/ours
              git show ":3:$f" > /tmp/theirs
              git merge-file --union /tmp/ours /tmp/base /tmp/theirs || true
              cp /tmp/ours "$f"
              git add "$f"
            done <<< "$conflicts"
            GIT_EDITOR=true git cherry-pick --continue
          fi

          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('zotero-mcp-plugin/src/modules/streamableMCPServer.ts')
          s = p.read_text()
          registry = s.index('const registry = getToolRegistry();')
          defaults = list(re.finditer(r'(?m)^        default:\s*(?:\{)?\s*$', s[:registry]))
          if len(defaults) < 2:
              raise SystemExit(f'expected at least two defaults before registry, found {len(defaults)}')
          external_default = defaults[-1]
          previous_default = defaults[-2]
          segment = s[previous_default.start():external_default.start()]
          unknown = 'throw new Error(`Unknown tool: ${name}`);'
          if unknown not in segment:
              raise SystemExit('previous default is not the old Unknown tool handler')
          throw_end = segment.index(unknown) + len(unknown)
          nl = segment.find('\n', throw_end)
          if nl == -1:
              nl = throw_end
          else:
              nl += 1
          segment = segment[:previous_default.start()-previous_default.start()] + segment[nl:]
          s = s[:previous_default.start()] + segment + s[external_default.start():]
          p.write_text(s)
          PY
          git add zotero-mcp-plugin/src/modules/streamableMCPServer.ts
          git commit --amend --no-edit

      - name: Validate build
        working-directory: zotero-mcp-plugin
        run: |
          npm ci
          npm run build

      - name: Validate diff
        shell: bash
        run: |
          git diff d97cae2b8f823987596b151849d7abdd020a4cd9..HEAD --check
          test "$(git rev-list --count d97cae2b8f823987596b151849d7abdd020a4cd9..HEAD)" = "1"
          echo "Changed files:"
          git diff --name-only d97cae2b8f823987596b151849d7abdd020a4cd9..HEAD
          echo "Recent commits:"
          git log --oneline -2

      - name: Push rebased branch
        shell: bash
        run: |
          git push origin HEAD:pr92-external-tool-api-rebased --force-with-lease
