name: tmp rebase external tool api

on:
  push:
    branches:
      - tmp-rebase-external-tool-api

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr92-external-tool-api-rebased
          fetch-depth: 0

      - name: Inspect rebased conflict result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin pr92-external-tool-api
          set +e
          git cherry-pick 9015cd9faa4a55f1a732a78010b298e602e0f811
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              git show ":1:$f" > /tmp/base
              git show ":2:$f" > /tmp/ours
              git show ":3:$f" > /tmp/theirs
              git merge-file --union /tmp/ours /tmp/base /tmp/theirs || true
              cp /tmp/ours "$f"
              git add "$f"
            done <<< "$conflicts"
            GIT_EDITOR=true git cherry-pick --continue
          fi
          echo '--- default lines ---'
          grep -n '^[[:space:]]*default:' zotero-mcp-plugin/src/modules/streamableMCPServer.ts || true
          echo '--- registry context ---'
          line=$(grep -n 'const registry = getToolRegistry' zotero-mcp-plugin/src/modules/streamableMCPServer.ts | head -1 | cut -d: -f1)
          start=$((line-35)); if [ "$start" -lt 1 ]; then start=1; fi
          end=$((line+45))
          nl -ba zotero-mcp-plugin/src/modules/streamableMCPServer.ts | sed -n "${start},${end}p"
          exit 1
