name: tmp rebase http polling cleanup

on:
  push:
    branches:
      - tmp-rebase-http-polling-cleanup

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr92-http-polling-cleanup-rebased
          fetch-depth: 0

      - name: Reapply cleanup commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin pr92-http-polling-cleanup
          git cherry-pick b69283aac31a2b81ba11ef6b3994414e107df0a3

      - name: Validate build
        working-directory: zotero-mcp-plugin
        run: |
          npm ci
          npm run build

      - name: Validate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff 5ea39bb92bb99f7501f36f0884a7c99d56210d1f..HEAD --check
          mapfile -t files < <(git diff --name-only 5ea39bb92bb99f7501f36f0884a7c99d56210d1f..HEAD)
          printf 'Changed files:\n%s\n' "${files[*]}"
          test "${#files[@]}" -eq 2
          printf '%s\n' "${files[@]}" | grep -qx 'zotero-mcp-plugin/src/modules/httpServer.ts'
          printf '%s\n' "${files[@]}" | grep -qx 'zotero-mcp-plugin/src/modules/preferenceScript.ts'
          test "$(git rev-list --count 5ea39bb92bb99f7501f36f0884a7c99d56210d1f..HEAD)" -eq 1

      - name: Push rebased branch
        shell: bash
        run: |
          git push origin HEAD:pr92-http-polling-cleanup-rebased --force-with-lease
