<!DOCTYPE window>
<!--
  All user-visible text is localized through Fluent: the ftl file below is
  linked here and every label is filled from `document.l10n.formatValue()` in
  `applyL10n()`. The English text in the markup is only the pre-localization
  fallback used when a message is missing from the active locale.
-->
<window
  id="zotero-mcp-semantic-search-window"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  title="Semantic Search"
  width="1000"
  height="600"
  persist="width,height,screenX,screenY"
>
  <linkset>
    <html:link rel="localization" href="__addonRef__-addon.ftl" />
  </linkset>

  <script src="chrome://zotero/content/include.js"></script>
  <script src="chrome://zotero/content/customElements.js"></script>

  <script type="application/javascript">
    <![CDATA[
      // ========== Localization (Fluent) ==========
      // Keys come from addon/locale/<locale>/addon.ftl; the FTL is linked above.
      const L10N_KEYS = [
        'semantic-search-title', 'semantic-search-placeholder', 'semantic-search-btn',
        'semantic-search-hint', 'semantic-search-close', 'semantic-search-error',
        'semantic-searching', 'semantic-enter-query', 'semantic-no-results',
        'semantic-search-score', 'semantic-search-creators', 'semantic-search-year',
        'semantic-query-label', 'semantic-query-number',
        'semantic-query-add-tooltip', 'semantic-query-remove-tooltip',
        'semantic-mode-label', 'semantic-mode-hybrid', 'semantic-mode-semantic',
        'semantic-mode-keyword', 'semantic-mode-hint-hybrid',
        'semantic-mode-hint-semantic', 'semantic-mode-hint-keyword',
        'semantic-granularity-label', 'semantic-granularity-section',
        'semantic-granularity-location', 'semantic-granularity-location-hint',
        'semantic-operator-using', 'semantic-formula-minimum',
        'semantic-formula-product', 'semantic-formula-average',
        'semantic-match-both', 'semantic-match-any',
        'semantic-column-title', 'semantic-column-location', 'semantic-column-type',
        'semantic-stat-match', 'semantic-stat-semantic', 'semantic-stat-keyword',
        'semantic-stat-both', 'semantic-stat-found',
        'semantic-save-collection', 'semantic-saved-collection',
        'semantic-save-failed', 'semantic-open-selected', 'semantic-untitled',
        'semantic-table-error', 'semantic-disabled'
      ];

      const L10N = Object.create(null);

      async function loadL10n() {
        const bundle = document.l10n;
        if (!bundle) {
          console.error('[SemanticDialog] document.l10n is unavailable; keeping markup fallbacks');
          return;
        }
        await Promise.all(L10N_KEYS.map(async (key) => {
          try {
            L10N[key] = await bundle.formatValue(key);
          } catch (e) {
            // Keep the markup fallback for this key.
          }
        }));
      }

      /** Synchronous lookup for strings loaded once at startup. */
      function t(key) {
        return L10N[key] || '';
      }

      /** Formatted lookup for strings with Fluent variables. */
      async function tArgs(key, args) {
        try {
          return await document.l10n.formatValue(key, args);
        } catch (e) {
          return key;
        }
      }

      // ========== Window Arguments ==========
      const args = window.arguments[0];
      const searchCallback = args.searchCallback;
      const openItemCallback = args.openItemCallback;
      const findSimilarCallback = args.findSimilarCallback;
      const VTHelper = args.VirtualizedTableHelper;
      // Pure result helpers, shared with the unit tests (dialogResults.ts).
      const R = args.resultUtils;
      // Preference gate, re-read on every search so a runtime toggle takes effect.
      const isSemanticEnabled = args.isSemanticEnabled;

      if (!R) {
        throw new Error('[SemanticDialog] Missing resultUtils window argument');
      }

      // ========== State ==========
      let searchResults = [];
      let displayData = [];
      let activeQueryCount = 1;
      let searchMode = 'semantic';
      let granularity = 'section';
      let currentSortColumn = null;
      let currentSortAscending = true;
      let searchTimer = null;
      let tableHelper = null;
      let tableInitialized = false;
      // Guards against a slow older search overwriting newer results.
      const sequencer = R.createSearchSequencer();

      // Snippet tooltip state (matches ZotSeek pattern)
      let snippetTooltip = null;
      let highlightTerms = [];
      let hoveredSnippetRow = -1;

      const SNIPPET_STOPWORDS = new Set([
        'the', 'a', 'an', 'and', 'or', 'of', 'to', 'in', 'on', 'at', 'by', 'for',
        'with', 'as', 'is', 'are', 'was', 'were', 'be', 'been', 'it', 'its', 'this',
        'that', 'these', 'those', 'from', 'how', 'do', 'does', 'did', 'can', 'we',
        'they', 'their', 'them', 'about', 'into', 'than', 'then', 'but', 'not',
      ]);

      const HTML_NS = 'http://www.w3.org/1999/xhtml';

      /** Resolve once the document can be queried. */
      function whenDomReady() {
        if (document.readyState === 'interactive' || document.readyState === 'complete') {
          return Promise.resolve();
        }
        return new Promise((resolve) => {
          document.addEventListener('DOMContentLoaded', () => resolve(), { once: true });
        });
      }

      /**
       * Initialization handshake.
       *
       * The controller awaits this promise instead of polling for `performSearch`,
       * so it can never race the DOM or the localization pass, and the controller
       * can time out when the dialog fails to load.
       */
      window._initPromise = (async () => {
        if (typeof Zotero !== 'undefined' && Zotero.initializationPromise) {
          await Zotero.initializationPromise;
        }
        await whenDomReady();
        await loadL10n();
        init();
      })();

      // ========== Init ==========
      function init() {
        applyL10n();

        // Explicitly set initial mode value (XUL selected="true" can be unreliable)
        const modeSelect = document.getElementById('search-mode-select');
        if (modeSelect) modeSelect.value = 'semantic';

        const query1 = document.getElementById('zotseek-query-1');
        query1.addEventListener('input', () => {
          clearTimeout(searchTimer);
          // Auto-search on a debounce only in keyword mode: it is local and free.
          // Semantic and hybrid modes each cost an embedding call, so they wait
          // for Enter or the Search button.
          if (searchMode !== 'keyword') return;
          searchTimer = setTimeout(() => {
            if (query1.value.trim().length >= 3) performSearch();
          }, 500);
        });
        query1.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); clearTimeout(searchTimer); performSearch(); }
        });

        document.getElementById('zotseek-add-query-btn').addEventListener('command', addQuery);
        document.getElementById('zotseek-btn').addEventListener('command', performSearch);

        for (let i = 2; i <= 4; i++) {
          const btn = document.getElementById('zotseek-remove-query-' + i + '-btn');
          if (btn) btn.addEventListener('command', () => removeQuery(i));
        }

        document.getElementById('query-combine-operator').addEventListener('command', updateOperatorUI);
        document.getElementById('search-mode-select').addEventListener('command', onSearchModeChange);
        document.getElementById('granularity-section').addEventListener('change', onGranularityChange);
        document.getElementById('granularity-location').addEventListener('change', onGranularityChange);

        document.getElementById('zotseek-open-btn').addEventListener('command', openSelectedItem);
        document.getElementById('zotseek-close-btn').addEventListener('command', () => window.close());
        document.getElementById('zotseek-save-collection-btn').addEventListener('command', saveAsCollection);

        // Initialize the table and snippet tooltip once
        initTable();
        setupSnippetTooltip();

        query1.focus();
        if (args.initialQuery) { query1.value = args.initialQuery; performSearch(); }
      }

      /** Apply every localized string; missing messages keep the markup fallback. */
      function applyL10n() {
        if (t('semantic-search-title')) document.title = t('semantic-search-title');

        const set = (id, attr, key) => {
          const el = document.getElementById(id);
          const value = t(key);
          if (el && value) el.setAttribute(attr, value);
        };
        set('zotseek-query-1', 'placeholder', 'semantic-search-placeholder');
        set('zotseek-add-query-btn', 'tooltiptext', 'semantic-query-add-tooltip');
        set('zotseek-btn', 'label', 'semantic-search-btn');
        for (let i = 2; i <= 4; i++) {
          set('zotseek-remove-query-' + i + '-btn', 'tooltiptext', 'semantic-query-remove-tooltip');
        }
        set('search-mode-hint', 'value', 'semantic-mode-hint-semantic');
        set('zotseek-save-collection-btn', 'label', 'semantic-save-collection');
        set('zotseek-open-btn', 'label', 'semantic-open-selected');
        set('zotseek-close-btn', 'label', 'semantic-search-close');
        set('zotseek-footer-hint', 'value', 'semantic-search-hint');
        set('zotseek-operator-using', 'value', 'semantic-operator-using');
        set('granularity-location', 'tooltiptext', 'semantic-granularity-location-hint');

        const setLabel = (selector, key) => {
          const el = document.querySelector(selector);
          const value = t(key);
          if (el && value) el.setAttribute('value', value);
        };
        setLabel('.query-row-1 .query-label', 'semantic-query-label');
        setLabel('#search-mode-row .query-label', 'semantic-mode-label');
        setLabel('#granularity-row .query-label', 'semantic-granularity-label');

        // Numbered query labels carry the query index.
        (async () => {
          for (let i = 2; i <= 4; i++) {
            const row = document.querySelector('#query-row-' + i);
            const label = row && row.querySelector('.query-label');
            if (!label || !document.l10n) continue;
            try {
              label.setAttribute('value', await document.l10n.formatValue('semantic-query-number', { n: i }));
            } catch (e) { /* keep the markup fallback */ }
          }
        })();

        const sectionSpan = document.querySelector('#granularity-section');
        if (sectionSpan && sectionSpan.nextElementSibling && t('semantic-granularity-section')) {
          sectionSpan.nextElementSibling.textContent = t('semantic-granularity-section');
        }
        const locationSpan = document.querySelector('#granularity-location');
        if (locationSpan && locationSpan.nextElementSibling && t('semantic-granularity-location')) {
          locationSpan.nextElementSibling.textContent = t('semantic-granularity-location');
        }

        const modeSelect = document.getElementById('search-mode-select');
        if (modeSelect) {
          const items = modeSelect.querySelectorAll('menuitem');
          const keys = ['semantic-mode-hybrid', 'semantic-mode-semantic', 'semantic-mode-keyword'];
          keys.forEach((key, index) => {
            if (items[index] && t(key)) items[index].setAttribute('label', t(key));
          });
        }
        const formula = document.getElementById('query-and-formula');
        if (formula) {
          const items = formula.querySelectorAll('menuitem');
          const keys = ['semantic-formula-minimum', 'semantic-formula-product', 'semantic-formula-average'];
          keys.forEach((key, index) => {
            if (items[index] && t(key)) items[index].setAttribute('label', t(key));
          });
        }
        const hint = document.getElementById('query-operator-hint');
        if (hint && t('semantic-match-both')) hint.setAttribute('value', t('semantic-match-both'));
      }

      // ========== Multi-Query ==========
      function addQuery() {
        if (activeQueryCount >= 4) return;
        activeQueryCount++;
        const row = document.getElementById('query-row-' + activeQueryCount);
        if (row) {
          row.style.display = 'flex';
          const input = document.getElementById('zotseek-query-' + activeQueryCount);
          if (input) {
            input.focus();
            input.addEventListener('input', () => {
              clearTimeout(searchTimer);
              if (searchMode !== 'keyword') return;
              searchTimer = setTimeout(() => { if (input.value.trim().length >= 3) performSearch(); }, 500);
            });
            input.addEventListener('keypress', (e) => {
              if (e.key === 'Enter') { e.preventDefault(); clearTimeout(searchTimer); performSearch(); }
            });
          }
        }
        if (activeQueryCount >= 2) document.getElementById('query-operator-row').style.display = 'flex';
        if (activeQueryCount >= 4) document.getElementById('zotseek-add-query-btn').style.visibility = 'hidden';
      }

      function removeQuery(rowNum) {
        for (let i = rowNum; i < activeQueryCount; i++) {
          const next = document.getElementById('zotseek-query-' + (i + 1));
          const curr = document.getElementById('zotseek-query-' + i);
          if (next && curr) curr.value = next.value;
        }
        const lastRow = document.getElementById('query-row-' + activeQueryCount);
        if (lastRow) lastRow.style.display = 'none';
        const lastInput = document.getElementById('zotseek-query-' + activeQueryCount);
        if (lastInput) lastInput.value = '';
        activeQueryCount--;
        if (activeQueryCount < 4) document.getElementById('zotseek-add-query-btn').style.visibility = 'visible';
        if (activeQueryCount < 2) document.getElementById('query-operator-row').style.display = 'none';
      }

      function updateOperatorUI() {
        const op = document.getElementById('query-combine-operator').value;
        const fc = document.getElementById('query-formula-container');
        const hint = document.getElementById('query-operator-hint');
        if (op === 'and') {
          fc.style.display = 'flex';
          if (t('semantic-match-both')) hint.setAttribute('value', t('semantic-match-both'));
        } else {
          fc.style.display = 'none';
          if (t('semantic-match-any')) hint.setAttribute('value', t('semantic-match-any'));
        }
      }

      function onSearchModeChange() {
        searchMode = document.getElementById('search-mode-select').value;
        const hint = document.getElementById('search-mode-hint');
        const key = searchMode === 'hybrid'
          ? 'semantic-mode-hint-hybrid'
          : (searchMode === 'semantic' ? 'semantic-mode-hint-semantic' : 'semantic-mode-hint-keyword');
        if (t(key)) hint.setAttribute('value', t(key));
      }

      function onGranularityChange() {
        const checked = document.querySelector('input[name="granularity"]:checked');
        if (checked) {
          granularity = checked.value;
          if (searchResults.length > 0) refreshTable();
        }
      }

      // ========== Search ==========
      function collectQueries() {
        const queries = [];
        for (let i = 1; i <= activeQueryCount; i++) {
          const input = document.getElementById('zotseek-query-' + i);
          if (input && input.value.trim()) queries.push(input.value.trim());
        }
        return queries;
      }

      async function performSearch() {
        // The preference can be turned off while the dialog is open.
        if (typeof isSemanticEnabled === 'function' && !isSemanticEnabled()) {
          showStatus(t('semantic-disabled'));
          return;
        }

        const queries = collectQueries();
        if (queries.length === 0) { showStatus(t('semantic-enter-query')); return; }
        showStatus(t('semantic-searching') || '…');

        // Pure semantic search has no literal-term highlighting; keyword and
        // hybrid modes highlight the tokenized query terms in the tooltip.
        setQueryTerms(searchMode === 'semantic' ? [] : queries.flatMap((q) => q.split(/\s+/)));

        const token = sequencer.next();
        try {
          const allResults = [];
          for (const query of queries) {
            let results;
            if (searchMode === 'semantic') results = await searchCallback(query);
            else if (searchMode === 'keyword') results = await keywordSearch(query);
            else {
              const [sem, kw] = await Promise.all([
                searchCallback(query).catch(() => []),
                keywordSearch(query).catch(() => [])
              ]);
              results = R.mergeResults(sem || [], kw || []);
            }
            if (!sequencer.isCurrent(token)) return;
            allResults.push(results || []);
          }

          let finalResults;
          if (allResults.length === 1) {
            finalResults = allResults[0];
          } else {
            const op = document.getElementById('query-combine-operator').value;
            finalResults = op === 'and'
              ? R.intersectResults(allResults, document.getElementById('query-and-formula').value)
              : R.unionResults(allResults);
          }

          // A newer search started while this one was in flight: drop the result.
          if (!sequencer.isCurrent(token)) return;

          // Reset sort to default (by score, descending)
          currentSortColumn = null;
          currentSortAscending = true;
          searchResults = R.sortResults(finalResults, 'similarity', -1);
          await refreshTable();
          await updateMatchStats(searchResults);
          updateSortIndicator();
        } catch (error) {
          if (!sequencer.isCurrent(token)) return;
          showStatus(await tArgs('semantic-search-error', { error: error.message || String(error) }));
        }
      }

      /**
       * Literal keyword search over the user library.
       *
       * Zotero.Search ORs every condition, so only real literal-match conditions
       * belong here. `itemType isNot attachment` used to be one of them, which
       * made the search match every non-attachment item and return the first 100
       * rows regardless of the query.
       */
      async function keywordSearch(query) {
        const search = new Zotero.Search();
        search.libraryID = Zotero.Libraries.userLibraryID;
        search.addCondition('joinMode', 'any');
        R.configureKeywordSearch(search, query);

        const ids = await search.search();
        if (!ids || ids.length === 0) return [];

        const items = await Zotero.Items.getAsync(Array.from(ids).slice(0, 100));
        const results = [];
        for (const item of items) {
          if (!item || !item.isRegularItem()) continue;
          results.push(buildKeywordResult(item, query));
        }
        return results;
      }

      function buildKeywordResult(item, query) {
        let creators = '';
        try {
          creators = item.getCreators().map((c) => c.lastName || '').filter(Boolean).join(', ');
        } catch (e) { /* creator list unavailable */ }
        let year = null;
        try { year = parseInt(item.getField('year'), 10) || null; } catch (e) { /* no year field */ }
        // `item.itemType`, not `item.getItemType()`: the latter does not exist.
        const itemType = item.itemType || '';
        const title = item.getDisplayTitle() || t('semantic-untitled') || '';

        let abstract = '';
        try { abstract = item.getField('abstractNote') || ''; } catch (e) { /* no abstract */ }

        const titleLower = title.toLowerCase();
        const abstractLower = abstract.toLowerCase();
        const queryLower = query.toLowerCase();
        let snippet = '';
        if (titleLower.includes(queryLower)) {
          snippet = title;
        } else if (abstractLower.includes(queryLower)) {
          const index = abstractLower.indexOf(queryLower);
          const start = Math.max(0, index - 50);
          const end = Math.min(abstract.length, index + query.length + 100);
          snippet = (start > 0 ? '...' : '') + abstract.substring(start, end) +
            (end < abstract.length ? '...' : '');
        } else {
          snippet = abstract.substring(0, 150) + (abstract.length > 150 ? '...' : '');
        }

        return {
          itemKey: item.key,
          parentKey: item.parentKey || undefined,
          title,
          creators,
          year,
          itemType,
          score: 0.5,
          matchedChunks: [{ chunkId: 0, text: snippet, score: 0.5 }],
          sources: ['keyword'],
        };
      }

      // ========== Match Stats ==========
      async function updateMatchStats(results) {
        const bar = document.getElementById('zotseek-match-stats');
        if (!bar) return;
        let semantic = 0;
        let keyword = 0;
        let both = 0;
        for (const row of results) {
          const sources = row.sources || ['semantic'];
          if (sources.includes('both') || (sources.includes('semantic') && sources.includes('keyword'))) both++;
          else if (sources.includes('keyword')) keyword++;
          else semantic++;
        }

        const total = results.length;
        if (total === 0) {
          bar.style.display = 'none';
          bar.replaceChildren();
          showStatus(t('semantic-no-results'));
          return;
        }

        const matches = results.reduce((sum, row) => sum + (row.matchedChunks ? row.matchedChunks.length : 0), 0);
        bar.style.display = 'flex';
        bar.replaceChildren();

        const addPart = (text, color) => {
          const span = document.createElementNS(HTML_NS, 'span');
          span.textContent = text;
          if (color) span.style.color = color;
          bar.appendChild(span);
          return span;
        };
        const addDot = () => addPart('·', '#757575');

        if (t('semantic-stat-match')) {
          const label = addPart(t('semantic-stat-match') + ' ', null);
          label.style.fontWeight = '600';
        }
        addPart('🧠 ' + t('semantic-stat-semantic') + ': ' + semantic, '#1976D2');
        addDot();
        addPart('🔤 ' + t('semantic-stat-keyword') + ': ' + keyword, '#F57C00');
        addDot();
        addPart('🔗 ' + t('semantic-stat-both') + ': ' + both, '#388E3C');
        addDot();
        addPart(await tArgs('semantic-stat-found', { count: total, matches }), '#424242');

        document.getElementById('zotseek-open-btn').disabled = false;
        document.getElementById('zotseek-save-collection-btn').disabled = false;
      }

      // ========== Table Rendering (VirtualizedTableHelper) ==========

      /**
       * Initialize the VirtualizedTable ONCE (matches ZotSeek pattern).
       * Subsequent data updates just call tableHelper.render().
       */
      async function initTable() {
        if (tableInitialized) return;
        try {
          tableHelper = new VTHelper(window);
          tableHelper.setContainerId('zotseek-results-container');
          tableHelper.setProp({
            id: 'zotseek-results-table',
            showHeader: true,
            staticColumns: false,
            multiSelect: true,
            disableFontSizeScaling: false,
            linesPerRow: 1.6,
            columns: getColumns(),
            getRowCount: () => displayData.length,
            getRowData: getRowData,
            getRowString: (index) => {
              const row = displayData[index];
              return row ? (row.title || '') : '';
            },
            onColumnSort: (columnIndex) => {
              handleColumnSort(columnIndex);
            },
            onSelectionChange: (selection) => {
              document.getElementById('zotseek-open-btn').disabled = selection.count === 0;
            },
            onActivate: (e, items) => {
              if (items && items.length > 0) {
                const row = displayData[items[0]];
                if (row) openItemCallback(row.itemKey);
              }
            },
            onItemContextMenu: () => {
              // Reserved for a result context menu.
            },
            storeColumnPrefs: () => {
              // Column preferences are not persisted yet.
            },
          });
          tableHelper.render(0);
          tableInitialized = true;
        } catch (err) {
          showStatus(await tArgs('semantic-table-error', { error: err.message || String(err) }));
        }
      }

      /**
       * Refresh the table data and re-render (without destroying the VTHelper).
       */
      async function refreshTable() {
        displayData = buildDisplayData();
        hideSnippetTooltip();

        if (!tableInitialized) {
          await initTable();
          return;
        }

        if (displayData.length === 0) {
          document.getElementById('zotseek-open-btn').disabled = true;
          document.getElementById('zotseek-save-collection-btn').disabled = true;
        }

        try {
          await tableHelper.render();
        } catch (err) {
          // If render fails, try re-initializing
          tableInitialized = false;
          await initTable();
        }
      }

      function buildDisplayData() {
        if (granularity === 'location') {
          const data = [];
          for (const result of searchResults) {
            if (result.matchedChunks && result.matchedChunks.length > 0) {
              for (let i = 0; i < result.matchedChunks.length; i++) {
                data.push({ ...result, _chunkIndex: i, _chunk: result.matchedChunks[i] });
              }
            } else {
              data.push({ ...result, _chunkIndex: 0, _chunk: null });
            }
          }
          return data;
        }
        // In section mode, attach the best chunk as _chunk for location display
        return searchResults.map((row) => {
          const bestChunk = (row.matchedChunks && row.matchedChunks.length > 0) ? row.matchedChunks[0] : null;
          return { ...row, _chunkIndex: 0, _chunk: bestChunk };
        });
      }

      function getColumns() {
        return [
          { dataKey: 'indicator', label: '', fixedWidth: true, width: 32, staticWidth: true, ignoreInColumnPicker: true },
          { dataKey: 'similarity', label: t('semantic-search-score'), fixedWidth: true, width: 110, staticWidth: true },
          { dataKey: 'title', label: t('semantic-column-title'), flex: 1 },
          { dataKey: 'authors', label: t('semantic-search-creators'), fixedWidth: true, width: 180, staticWidth: true },
          { dataKey: 'year', label: t('semantic-search-year'), fixedWidth: true, width: 50, staticWidth: true },
          { dataKey: 'page', label: t('semantic-column-location'), fixedWidth: true, width: 90, staticWidth: true },
          { dataKey: 'source', label: t('semantic-column-type'), fixedWidth: true, width: 80, staticWidth: true }
        ];
      }

      function getRowData(index) {
        const result = displayData[index];
        if (!result) return {};
        const sources = result.sources || ['semantic'];
        let indicator = '🧠';
        if (sources.includes('both') || (sources.includes('semantic') && sources.includes('keyword'))) indicator = '🔗';
        else if (sources.includes('keyword')) indicator = '🔤';

        const score = result._chunk ? result._chunk.score : result.score;
        const similarity = R.formatScore(score);
        const title = result.title || t('semantic-untitled');
        const authors = result.creators || '';
        const year = result.year ? String(result.year) : '';

        // Location: paragraph index from chunkId. The vector store keeps no page
        // numbers, so this is a paragraph index, not a page number.
        let page = '—';
        if (result._chunk) {
          page = '¶' + (result._chunk.chunkId + 1);
        }
        const source = result.itemType || '';

        return { indicator, similarity, title, authors, year, page, source };
      }

      /**
       * Handle column sort click (matches ZotSeek pattern).
       * Tracks sort state internally and toggles direction.
       */
      function handleColumnSort(columnIndex) {
        const columns = getColumns();
        const column = columns[columnIndex];
        if (!column) return;

        const dataKey = column.dataKey;
        if (dataKey === 'indicator' || dataKey === 'page') return;

        let ascending;
        if (currentSortColumn === dataKey) {
          ascending = !currentSortAscending;
        } else {
          ascending = (dataKey !== 'similarity' && dataKey !== 'year');
        }

        currentSortColumn = dataKey;
        currentSortAscending = ascending;

        searchResults = R.sortResults(searchResults, dataKey, ascending ? 1 : -1);
        refreshTable();
        updateSortIndicator();
      }

      /**
       * Update visual sort indicator (CSS classes) on column headers.
       */
      function updateSortIndicator() {
        const container = document.getElementById('zotseek-results-container');
        if (!container) return;
        const headerCells = container.querySelectorAll('.tree-header .cell');
        headerCells.forEach((cell) => {
          const dataKey = cell.getAttribute('data-key');
          cell.classList.remove('sorted-ascending', 'sorted-descending');
          if (dataKey === currentSortColumn) {
            cell.classList.add(currentSortAscending ? 'sorted-ascending' : 'sorted-descending');
          }
        });
      }

      function openSelectedItem() {
        if (!tableHelper || !tableHelper.treeInstance) return;
        const selection = tableHelper.treeInstance.selection;
        if (selection && selection.count > 0) {
          const index = selection.focused;
          if (index >= 0 && index < displayData.length) {
            openItemCallback(displayData[index].itemKey);
          }
        }
      }

      // ========== Save as Collection ==========
      async function saveAsCollection() {
        const button = document.getElementById('zotseek-save-collection-btn');
        if (button.disabled) return;
        button.disabled = true;

        try {
          const queries = collectQueries();
          const name = R.buildCollectionName(t('semantic-save-collection'), queries);
          const libraryID = Zotero.Libraries.userLibraryID;

          const itemIDs = [];
          const seenKeys = new Set();
          for (const result of searchResults) {
            if (seenKeys.has(result.itemKey)) continue;
            seenKeys.add(result.itemKey);
            const item = await Zotero.Items.getByLibraryAndKeyAsync(libraryID, result.itemKey);
            if (item) itemIDs.push(item.id);
          }
          if (itemIDs.length === 0) {
            showStatus(t('semantic-no-results'));
            return;
          }

          // Collection.addItems() is async and needs a transaction; without
          // awaiting it the rejection escaped the try and the collection was
          // saved empty while the dialog still reported success.
          await Zotero.DB.executeTransaction(async () => {
            const collection = new Zotero.Collection();
            collection.libraryID = libraryID;
            collection.name = name;
            await collection.save();
            await collection.addItems(itemIDs);
          });

          showStatus(await tArgs('semantic-saved-collection', { count: itemIDs.length, name }));
        } catch (e) {
          showStatus(await tArgs('semantic-save-failed', { error: e.message || String(e) }));
        } finally {
          button.disabled = false;
        }
      }

      // ========== Snippet Tooltip (matches ZotSeek implementation exactly) ==========

      /**
       * Create the floating snippet tooltip element and wire hover/scroll handlers.
       * Uses event delegation on the table container so it survives the
       * VirtualizedTable recycling row DOM nodes during scroll.
       */
      function setupSnippetTooltip() {
        if (snippetTooltip) return;

        const tip = document.createElementNS(HTML_NS, 'div');
        tip.className = 'zotseek-snippet-tooltip';
        tip.setAttribute('role', 'tooltip');
        tip.setAttribute('aria-hidden', 'true');
        // Append to <html> (documentElement) to keep tooltip above table and free of container overflow clipping
        (document.documentElement || document.body).appendChild(tip);
        snippetTooltip = tip;

        const container = document.getElementById('zotseek-results-container');
        container.addEventListener('mousemove', (e) => onTableMouseMove(e));
        container.addEventListener('mouseleave', () => hideSnippetTooltip());
        // Hide while scrolling: the row under the cursor changes without a mousemove
        container.addEventListener('scroll', () => hideSnippetTooltip(), true);
      }

      /**
       * Resolve the result row under the cursor and show/hide its snippet tooltip.
       */
      function onTableMouseMove(e) {
        if (!snippetTooltip) return;

        const target = e.target;
        const rowEl = target && target.closest ? target.closest('[id^="zotseek-results-table-row-"]') : null;
        if (!rowEl) {
          hideSnippetTooltip();
          return;
        }

        const index = parseInt(rowEl.id.slice('zotseek-results-table-row-'.length), 10);
        if (Number.isNaN(index)) {
          hideSnippetTooltip();
          return;
        }

        // Mousemove fires for every pointer pixel. Avoid rebuilding the tooltip DOM
        // while the pointer remains on the same virtualized row; only reposition it.
        if (index === hoveredSnippetRow && snippetTooltip.classList.contains('show')) {
          positionTooltip(e.clientX, e.clientY);
          return;
        }

        const result = displayData[index];
        const fragment = result ? buildSnippetFragment(result) : null;
        if (!fragment) {
          hideSnippetTooltip();
          return;
        }

        snippetTooltip.replaceChildren(fragment);
        hoveredSnippetRow = index;
        snippetTooltip.classList.add('show');
        snippetTooltip.setAttribute('aria-hidden', 'false');
        positionTooltip(e.clientX, e.clientY);
      }

      /**
       * Position the tooltip near the cursor, flipping away from viewport edges.
       */
      function positionTooltip(x, y) {
        if (!snippetTooltip) return;
        const pad = 16;
        const w = snippetTooltip.offsetWidth;
        const h = snippetTooltip.offsetHeight;
        let left = x + pad;
        let top = y + pad;
        if (left + w > window.innerWidth - 8) left = x - w - pad;
        if (top + h > window.innerHeight - 8) top = y - h - pad;
        snippetTooltip.style.left = Math.max(8, left) + 'px';
        snippetTooltip.style.top = Math.max(8, top) + 'px';
      }

      /**
       * Hide the snippet tooltip (does not remove it, just hides via CSS).
       */
      function hideSnippetTooltip() {
        if (!snippetTooltip) return;
        snippetTooltip.classList.remove('show');
        snippetTooltip.setAttribute('aria-hidden', 'true');
        hoveredSnippetRow = -1;
      }

      /**
       * Build the tooltip content for a result as a DOM fragment.
       *
       * Every piece of library text is appended as text, or as a `<mark>` whose
       * `textContent` is set, so a chunk containing `&`, `<` or a query term
       * like `amp` can no longer break the tooltip markup.
       */
      function buildSnippetFragment(result) {
        const chunk = result._chunk ||
          (result.matchedChunks && result.matchedChunks.length > 0 ? result.matchedChunks[0] : null);
        const chunkText = chunk ? chunk.text : '';
        if (!chunkText || !chunkText.trim()) return null;

        const snippet = R.windowSnippet(chunkText, 360, highlightTerms);
        const fragment = document.createDocumentFragment();

        const meta = [];
        if (chunk) {
          meta.push('📍 ' + t('semantic-column-location') + ': ¶' + ((chunk.chunkId ?? 0) + 1));
        }
        if (result.itemType) {
          meta.push('🏷️ ' + t('semantic-column-type') + ': ' + String(result.itemType));
        }
        const score = chunk ? chunk.score : result.score;
        if (score !== null && score !== undefined && !Number.isNaN(score)) {
          meta.push('🎯 ' + R.formatScore(score));
        }

        if (meta.length > 0) {
          const head = document.createElementNS(HTML_NS, 'div');
          head.className = 'zotseek-snippet-meta';
          meta.forEach((text, index) => {
            if (index > 0) {
              const separator = document.createElementNS(HTML_NS, 'span');
              separator.className = 'sep';
              separator.textContent = '·';
              head.appendChild(separator);
            }
            head.appendChild(document.createTextNode(text));
          });
          fragment.appendChild(head);
        }

        const body = document.createElementNS(HTML_NS, 'div');
        body.className = 'zotseek-snippet-body';
        for (const segment of R.highlightSegments(snippet, highlightTerms)) {
          if (segment.marked) {
            const mark = document.createElementNS(HTML_NS, 'mark');
            mark.textContent = segment.text;
            body.appendChild(mark);
          } else {
            body.appendChild(document.createTextNode(segment.text));
          }
        }
        fragment.appendChild(body);
        return fragment;
      }

      /**
       * Set the query terms to highlight inside the snippet tooltip.
       */
      function setQueryTerms(terms) {
        const seen = new Set();
        highlightTerms = [];
        for (const term of terms) {
          const word = (term || '').toLowerCase().trim();
          if (word.length < 2 || seen.has(word) || SNIPPET_STOPWORDS.has(word)) continue;
          seen.add(word);
          highlightTerms.push(word);
        }
      }

      function showStatus(msg) {
        const status = document.getElementById('zotseek-status-text');
        if (status && msg) status.setAttribute('value', msg);
      }

      // ========== Expose ==========
      window.showProgress = showStatus;
      window.displayResults = async (results) => {
        searchResults = results || [];
        await refreshTable();
        await updateMatchStats(searchResults);
      };
      window.showError = showStatus;
      window.performSearch = performSearch;
    ]]>
  </script>
